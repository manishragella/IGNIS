<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F6" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- Primary Blue/Purple Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Secondary Teal Gradient -->
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Green Earth Gradient -->
    <linearGradient id="earthGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Decorative Background Circles -->
  <circle cx="100" cy="100" r="150" fill="#E0E7FF" opacity="0.4" />
  <circle cx="750" cy="500" r="200" fill="#ECFDF5" opacity="0.5" />

  <!-- Main Illustration Group -->
  <g filter="url(#shadow)">
    <!-- Base Landscape (Earth) -->
    <path d="M 50 480 Q 200 440 400 460 T 750 480 L 750 520 L 50 520 Z" fill="url(#earthGrad)" />
    <path d="M 150 480 Q 300 450 500 470 T 700 495" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-dasharray="8 6" opacity="0.7" />

    <!-- Sun in Sky -->
    <circle cx="620" cy="180" r="50" fill="url(#sunGrad)" />
    <circle cx="620" cy="180" r="65" fill="none" stroke="#FDE68A" stroke-width="4" opacity="0.4" stroke-dasharray="10 8" />

    <!-- Modern Sustainable Schoolhouse -->
    <!-- Foundation -->
    <rect x="250" y="320" width="300" height="150" rx="12" fill="#FFFFFF" />
    <rect x="250" y="450" width="300" height="20" fill="#CBD5E1" />

    <!-- Roof -->
    <polygon points="230,320 570,320 540,260 260,260" fill="url(#primaryGrad)" />
    
    <!-- Solar Panels on Roof -->
    <polygon points="290,305 370,305 385,275 310,275" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <line x1="330" y1="305" x2="348" y2="275" stroke="#475569" stroke-width="1.5" />
    <line x1="310" y1="290" x2="378" y2="290" stroke="#475569" stroke-width="1.5" />

    <polygon points="395,305 475,305 490,275 415,275" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <line x1="435" y1="305" x2="453" y2="275" stroke="#475569" stroke-width="1.5" />
    <line x1="415" y1="290" x2="483" y2="290" stroke="#475569" stroke-width="1.5" />

    <!-- School Door -->
    <rect x="375" y="375" width="50" height="75" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
    <rect x="375" y="375" width="24" height="75" fill="#F8FAFC" />
    <circle cx="385" cy="415" r="3" fill="#64748B" />
    <circle cx="415" cy="415" r="3" fill="#64748B" />

    <!-- Windows (Glassmorphism) -->
    <rect x="280" y="350" width="60" height="60" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="3" />
    <line x1="310" y1="350" x2="310" y2="410" stroke="#99F6E4" stroke-width="1.5" />
    <line x1="280" y1="380" x2="340" y2="380" stroke="#99F6E4" stroke-width="1.5" />

    <rect x="460" y="350" width="60" height="60" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="3" />
    <line x1="490" y1="350" x2="490" y2="410" stroke="#99F6E4" stroke-width="1.5" />
    <line x1="460" y1="380" x2="520" y2="380" stroke="#99F6E4" stroke-width="1.5" />

    <!-- School Banner/Sign -->
    <rect x="350" y="225" width="100" height="30" rx="6" fill="url(#secondaryGrad)" />
    <text x="400" y="244" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">IGNIS</text>

    <!-- Wind Turbine (Sustainable Village Symbol) -->
    <g transform="translate(170, 260)">
      <!-- Turbine Tower -->
      <line x1="0" y1="0" x2="0" y2="200" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="0" x2="-10" y2="200" stroke="#CBD5E1" stroke-width="2" />
      <!-- Turbine Hub -->
      <circle cx="0" cy="0" r="10" fill="#64748B" />
      <!-- Turbine Blades -->
      <path d="M 0 0 C 15 -30 10 -80 0 -100 C -5 -80 -5 -30 0 0 Z" fill="#E2E8F0" />
      <path d="M 0 0 C -30 15 -80 10 -100 0 C -80 -5 -30 -5 0 0 Z" fill="#CBD5E1" />
      <path d="M 0 0 C 15 30 70 45 86 50 C 70 25 30 15 0 0 Z" fill="#94A3B8" />
    </g>

    <!-- Growing Trees (Educational & Ecological Symbol) -->
    <g transform="translate(600, 370)">
      <rect x="-8" y="0" width="16" height="100" rx="4" fill="#78350F" />
      <!-- Tree Crown (Overlapping Green Circles) -->
      <circle cx="0" cy="-20" r="45" fill="#059669" />
      <circle cx="-25" cy="-45" r="35" fill="#10B981" />
      <circle cx="25" cy="-45" r="35" fill="#34D399" />
      <circle cx="0" cy="-65" r="30" fill="#6EE7B7" />
      <!-- Apple details -->
      <circle cx="-15" cy="-30" r="4" fill="#EF4444" />
      <circle cx="20" cy="-25" r="4" fill="#EF4444" />
      <circle cx="0" cy="-50" r="4" fill="#EF4444" />
    </g>
  </g>

  <!-- Kid-Friendly Characters (Vector Silhouettes playing) -->
  <!-- Child 1 (Left) -->
  <g transform="translate(180, 435)" fill="#475569">
    <circle cx="0" cy="-25" r="8" />
    <path d="M -6 -15 Q 0 -18 6 -15 L 8 0 L 3 0 L 2 -8 L -2 -8 L -3 0 L -8 0 Z" />
    <!-- Raising hands -->
    <path d="M -6 -15 C -15 -25 -10 -30 -5 -25" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 6 -15 C 15 -25 12 -30 7 -25" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Child 2 (Right) -->
  <g transform="translate(220, 440)" fill="#475569">
    <circle cx="0" cy="-23" r="7" />
    <path d="M -5 -14 Q 0 -17 5 -14 L 6 0 L 2 0 L 1 -7 L -1 -7 L -2 0 L -6 0 Z" />
    <!-- Pointing forward -->
    <path d="M 5 -14 C 15 -10 18 -12 15 -8" stroke="#475569" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Educational UI Elements Mockup Frame (Math & Star details) -->
  <!-- Floating Sparkles & Math Icons -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round">
    <!-- Star -->
    <path d="M 120 180 L 125 195 L 140 195 L 128 205 L 132 220 L 120 210 L 108 220 L 112 205 L 100 195 L 115 195 Z" fill="#FDE68A" stroke="#F59E0B" transform="scale(0.8) translate(50, 50)" />
    <!-- Atom / Science icon -->
    <ellipse cx="680" cy="350" rx="30" ry="10" transform="rotate(30 680 350)" stroke="#06B6D4" />
    <ellipse cx="680" cy="350" rx="30" ry="10" transform="rotate(-30 680 350)" stroke="#06B6D4" />
    <circle cx="680" cy="350" r="5" fill="#0891B2" stroke="none" />
  </g>

  <!-- Title Caption inside SVG -->
  <rect x="200" y="495" width="400" height="45" rx="20" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
  <text x="400" y="523" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="0.5">
    IGNIS AI • CREATIVE WORKSHEET ILLUSTRATION
  </text>
</svg>
